syntax = "proto3";

import "Configuration.proto";

package AhsokaSystem;
option csharp_namespace = "Ahsoka.Services.System";

message SystemMessageTypes
{
	enum Ids
	{
		NO_MESSAGE = 0;

		ECHO = 1;
		GET_SERVICE_INFO = 4;
		GET_HARDWARE_INFORMATION = 8;

		LOAD_APPLICATION = 10;
		LOAD_APPLICATION_DATA = 12;
		LOAD_APPLICATION_CANCELLED = 14;

		GET_BRIGHTNESS = 15;
		SET_BRIGHTNESS = 17;

		GET_USB_INFO = 18;
		SET_USB_INFO = 20;

		SET_SERIAL_CONFIG = 23;

		UPDATE_TOUCH_TUNE = 29;

		SET_BOOT_LOGO = 30;

		REQUEST_SHUTDOWN = 100;
	}
}

// Echo (Test Method)
message EchoValue
{
	string data_value = 1;
}

// Service Info
message ServiceInfo
{
	repeated ServiceStats service_stats = 1; // System Services to Start.
}

// GetHardwareInformation Messages
message ServiceStats
{
	string service_name = 1;
	string service_address = 2;
	int32 receive_message_count = 3;
	int32 send_message_count = 4;
}

message GetHardwareInformationReply
{
	 AhsokaSystem.PlatformFamily platform_family = 1;
     string platform_qualifier = 2;
	 string part_number = 3;	
	 string serial_number = 4;
	 bool is_installer = 5;
	 string application_name = 6;
	 string device_key = 7;
	 string device_id = 8;
	 double cpu_temp_in_c = 9;
	 map<string, string> version_info = 100;
}

/// LoadApplication Messages
message LoadApplication
{
	string file_name = 1;
	int32 file_size = 2;
	int32 timeout_in_ms = 3;	
	bool autoload = 4;
}

message LoadApplicationReply
{
	int32 upload_id = 1;
	string file_name = 2;
	int32 max_bytes_per_message = 3;
	AhsokaSystem.MessageReplyStatus reply_status = 5;
	string reply_reason = 6;
}

message LoadApplicationData
{
	int32 upload_id = 1;
	bytes message_data = 2;
	int32 crc32 = 4;
}

message LoadApplicationDataReply
{
	int32 upload_id = 1;
	AhsokaSystem.MessageReplyStatus reply_status = 4;
	string reply_reason = 5;
}

message LoadApplicationCancelled
{
	int32 upload_id = 1;
}

message LoadApplicationCompleteEventArgs
{
	bool autoload = 1;
	string file_name = 2;
}

// Brightness
message BrightnessInfo
{
	int32 percentage = 1;
	optional bool persist = 2;
}

// USB
message UsbInfo
{
	UsbMode mode = 1;
	string mount_point = 2;
}

enum UsbMode
{
	UNKNOWN = 0;
	HOST = 1;
	DEVICE = 2;
}

// Echo (Test Method)
message ShutdownInformation
{
	ShutdownTypes shutdown_type = 1;
	int32 shutdown_code = 2;
}

enum ShutdownTypes
{
	SHUTDOWN_SERVICES = 0;
	SHUTDOWN_APPLICATION = 1;
	REBOOT = 2;
}

// We aren't going to enumerate every field in the rs485_config because the only other field is padding.
message RS485ConfigNotification
{
    uint32 flags = 1;
    uint32 delay_rts_before_send = 2;
    uint32 delay_rts_after_send = 3;
}


message TouchTuneInfo
{
	string firmware_file_name = 1;
	string configuration_file_name = 2;
}

message TouchTuneInfoReply
{
	AhsokaSystem.MessageReplyStatus reply_status = 1;
	string reply_reason = 2;
	map<string, string> version_info = 100;
}

message BootLogoInfo
{
	string path = 1;
	BootLogoRotation rotation = 2;
}

enum BootLogoRotation
{
	NO_ROTATION = 0;
	ROTATE_90 = 1;
	ROTATE_180 = 2;
	ROTATE_270 = 3;
}