syntax = "proto3";

import "protobuf-net/protogen.proto";

package AhsokaNetwork;
option csharp_namespace = "Ahsoka.Services.Network";

message WiFiClientMessageTypes
{
    enum Ids
    {
        NONE = 0;
        GET_ADAPTER = 1;
        GET_NETWORK_CONFIGURATION = 6;
        SET_NETWORK_CONFIGURATION = 8;

        // Client Only Calls
        DISCOVER_NETWORKS = 9;
        CONNECT_TO_NETWORK = 12;
        DISCONNECT_NETWORK = 13;
        CONNECTION_STATE_NOTIFICATION = 14;
        GET_NETWORK_PROFILES = 15;
        SET_NETWORK_PROFILES = 17;
        GET_NETWORK_INFO = 18;
        WIRELESS_SIGNAL_CHANGED = 19;
        ATTEMPT_AUTO_CONNECT = 20;
    }
}

//---------------------------------
//  Adapter Configuration
//---------------------------------
message AdapterRequest
{
    string adapter_id = 1;
}

//---------------------------------
//  Adapter Configuration
//---------------------------------
message AutoConnectRequest
{
    string adapter_id = 1;
    int32 wait_for_connection_seconds = 8;
    int32 wait_for_ip_address_seconds = 9 [(.protobuf_net.fieldopt).name = "WaitForIPAddressSeconds"];
    int32 wait_for_time_sync_seconds = 10;
}

message AdapterConfiguration
{
    string adapter_id = 1;
    string description = 2;
    IPConfiguration client_configuration = 4;
    string override_mac_address = 7;
    bool save_as_default = 99;
}

message AdapterResult
{    
    string adapter_id = 1;
    string error_description = 2;
    bool configuration_successful = 3;
}

message IPConfiguration
{
    IPAddressConfiguration connection_type = 1;
    string ip_address = 2 [(.protobuf_net.fieldopt).name = "IPAddress"];
    string gateway_ip = 3 [(.protobuf_net.fieldopt).name = "GatewayIP"];
    string dns = 4;
}

enum IPAddressConfiguration
{
    DHCP = 0;
    STATIC_IP = 1 [(.protobuf_net.enumvalopt).name = "StaticIP"];
}

//---------------------------------
//  Wireless Network Connections
//---------------------------------
message WirelessNetworkInfoList
{
    string adapter_id = 1;
    repeated WirelessNetworkInfo networks = 2;
}

message WirelessNetworkInfo
{
	SecurityType security_type = 2;
	WirelessConnectionState state = 4;
	string ssid = 5;
	int32 signal_level = 6;
}

enum SecurityType
{
    NO_SECURITY = 0;
    WPA = 1;
    WPA2 = 2;
    NOT_SUPPORTED_TYPE = 0xFF;
}

message WirelessConnectionRequest
{
    string adapter_id = 1;
	string ssid = 4;
    string pass_key = 5;
    bool remember = 6;
    bool encrypted = 7;
    int32 wait_for_connection_seconds = 8;
    int32 wait_for_ip_address_seconds = 9 [(.protobuf_net.fieldopt).name = "WaitForIPAddressSeconds"];
    int32 wait_for_time_sync_seconds = 10;
}


message WirelessConnectionNotification
{
 	string adapter_id = 1;
	WirelessConnectionState state = 2;
    string ssid = 3;
}

message WirelessConnectionResponse
{
 	string adapter_id = 1;
	WirelessConnectionState state = 2;
    string ssid = 3;
}


enum WirelessConnectionState
{
    CLIENT_READY = 0;
    CLIENT_DISCOVERING = 2;
    CLIENT_IDENTIFYING = 3;
    CLIENT_WAITING_FOR_IP = 4;
    CLIENT_WAITING_FOR_TIME = 5;
    CLIENT_CONNECTING = 6;
    CLIENT_CONNECTED = 7;
    CLIENT_DISCONNECTING = 8;
    CLIENT_DISCONNECTED = 9;
    CLIENT_CONNECTION_FAILED = 10;
    CLIENT_CONNECTION_SIGNAL_CHANGED = 11;
}

message ProfileRequest
{
    string adapter_id = 1;
    bool use_os_profiles = 2 [(.protobuf_net.fieldopt).name = "UseOSProfiles"];
}

message TimeSyncRequest
{
    int32 timeout_seconds = 1;
}

message TimeSyncResponse
{
    bool time_sync_complete = 1;
}

message NetworkProfilesList
{
    string adapter_id = 1;
    repeated WirelessConnectionRequest network_profiles = 2;
}

message IPInfo
{
    string adapter_id = 1;
    string mac_address = 2;
    string ip_address = 3 [(.protobuf_net.fieldopt).name = "IPAddress"];
    string gateway_ip = 4 [(.protobuf_net.fieldopt).name = "GatewayIP"];
    repeated string dns = 5;
}

