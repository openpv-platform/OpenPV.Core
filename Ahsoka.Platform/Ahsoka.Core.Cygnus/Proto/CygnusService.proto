syntax = "proto3";

import "reach.proto";

package AhsokaCygnus;
option csharp_namespace = "Ahsoka.Services.Cygnus";

message CygnusMessageTypes
{
    enum Ids
    {
        NONE                = 0;

        ENABLE_TRANSPORT    = 1;
        ADD_FILE            = 2;
        DEFINE_ENUM         = 3;
        ADD_COMMAND         = 4;
        ENABLE_CLI          = 5;
    }
}

enum CygnusInterface
{
    BLE = 0;
    TCP = 1;
    TCP_Serial = 2;
    CAN = 3;
    BLE_Cygnus = 4;
    TCP_Cygnus_Serial = 5;
}

message CygnusServiceEnableDisableTransports
{
    CygnusInterface Interface = 1;
}

message CygnusServiceFileInfo
{
    string name = 1;
    string path = 2;
    cr.AccessLevel permissions = 3;
}

message CygnusServiceCommandInfo
{
    string name = 1;
}

message CygnusServiceCommandInfoResponse
{
    cr.CommandInfo command_info = 1;
    int32 data_key_id = 2;
}

message CygnusServiceEnableCLIResponse
{
    int32 data_key_id = 1;
}
