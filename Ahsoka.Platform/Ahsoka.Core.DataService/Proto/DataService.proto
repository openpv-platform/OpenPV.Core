syntax = "proto3";
package AhsokaData;
option csharp_namespace = "Ahsoka.Services.Data";

message DataMessageTypes
{
    enum Ids
    {
        NONE = 0;
        ENABLE_CACHE = 1;
        SEARCH_AVAILABLE_KEYS = 2;
        GET_KEY_VALUES = 3;
        SET_KEY_VALUES = 4;
        SUBSCRIBE_TO_KEYS = 5;
        UNSUBSCRIBE_TO_KEYS = 6;
        NOTIFY_KEY_VALUE_CHANGED = 7;
        NOTIFY_KEY_ADDED = 8;
    }
}

// **************************************************
// Global Data Service Message Types
// **************************************************
message AvailableKeySearchInfo
{
    string origin_filter = 1;
    string key_filter = 2;
    string subscriber_id_filter = 3;
    DataAccessLevel mininum_access_level = 4; 
    bool invert_filters = 5;
}

message KeyList
{
    repeated KeyInfo Keys = 1;
}


message DataServiceKeyItem
{
    string key_name = 3;
    DataAccessLevel data_access_level = 4;
}


enum DataAccessLevel 
{
    InternalOnly = 0;
    Diagnostic = 1;
    Public = 2;
}

message KeyValueList
{
    repeated KeyValue Values = 1;
}

message KeyInfo
{
    string origin = 1;
    string key = 2;
    int32 value_id = 3; // used for faster lookup.
    DataAccessLevel mininum_access_level = 4; 
    string publisher_id = 5;
}


message KeyValue
{
    KeyInfo key_info = 1;
 
    oneof value 
    {
        bool boolean_value = 2;
        string string_value = 3;
        int64  integer_value = 4;
        uint64 unsigned_integer_value = 6;
        double float_value = 8;
        bytes data_value = 9;
    }
}

message KeySubscriberInfo
{
    string subscriber_id = 2;
}

message KeySubscriptionRequest
{
    repeated KeyInfo subscribe_to_key = 1;
    string subscriber_id = 2;
}

message KeyValueNotification
{
    repeated KeyValue key_values = 1;
    string subscriber_id = 2;
}

