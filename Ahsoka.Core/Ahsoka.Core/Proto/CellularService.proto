syntax = "proto3";
import "WiFiClientService.proto";
package AhsokaNetwork;
option csharp_namespace = "Ahsoka.Services.Network";

message CellularMessageTypes
{
    enum Ids
    {
        NONE = 0;
        GET_ADAPTERS = 1;
        START_NETWORK = 2;
        STOP_NETWORK = 3;
        GET_NETWORK_INFORMATION = 6;

        NETWORK_STATE_CHANGED = 8;
   }
}

message CellularServiceConfiguration 
{
    string adapter_id = 1;
    string description = 2;
    string apn = 3;
    string apn_user = 4;
    string apn_password = 6;
    int32 wait_for_time_sync_seconds = 7;
}

message CellularConnectionResult
{
    string adapter_id = 1;
    bool connection_started = 2;
    string description = 3;
}

message CellularNetworkInformation
{
    string adapter_id = 1;
    CellularNetworkState connection_state = 2;

    string service_name = 3; // --nas-get-operator-name
    string network_operator_name = 4;

    string rssi = 5; // --nas-get-signal-info
    string rsrq = 6;
    string rsrp = 7;
    string snr = 8;

     IPInfo ip_info = 9;
  
}

enum CellularNetworkState
{
    NOT_CONNECTED = 0;
    CONNECTION_IN_PROGRESS = 1;
    CONNECTED = 2;
}