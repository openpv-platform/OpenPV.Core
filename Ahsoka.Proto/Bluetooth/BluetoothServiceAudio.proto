syntax = "proto3";

package Ahsoka.Services.Bluetooth;

message CurrentSongInfo
{
    string name = 1;
    string artist = 2;
    string album = 3;
    bool is_playing = 4;
    int32 duration = 5;
    int32 elapsed = 6;
    int32 track_number = 7;
    int32 track_count = 8;
    bool is_shuffled = 9;
    bool is_repeat = 10;
    bool has_art = 11;
}

message MusicCommand
{
    MusicCommands command = 1;
    string command_data = 2;
}
message MusicCommandResponse
{
    MusicCommands command = 1;
    string command_data = 2;
    bool success = 3;
}

enum MusicCommands
{
    PLAY = 1;
    STOP = 2;
    FAST_FORWARD = 3;
    FAST_BACKWARD = 4;
}


