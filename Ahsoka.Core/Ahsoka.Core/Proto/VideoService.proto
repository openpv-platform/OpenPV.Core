syntax = "proto3";

package AhsokaVideo;
option csharp_namespace = "Ahsoka.Services.Video";

message VideoMessageTypes
{
	enum Ids
	{
		NONE = 0;
		GetVideoPlayers = 1;
		PlayVideo = 2;
	    StopVideo = 3;
		RequestStatus = 4;

		StatusUpdated = 5; // Notification if Configured
	}
}

message VideoPlaybackRequest
{
	int32 VideoPlayerID = 1;
	string VideoURL = 2;
	bool PlayFullScreen = 3;

	int32 VideoX = 4;
	int32 VideoY = 5;
	int32 VideoWidth = 6;
	int32 VideoHeight = 7;

	int32 StatusUpdateInMs = 8;
}


message VideoPlayerInfo
{
	repeated VideoPlayer Players = 1;
}


message VideoPlayer
{
	int32 VideoPlayerID = 1;
}

message VideoStatus
{
	int32 VideoPlayerID = 1;
	bool IsPlaying = 2;
	int32 TotalTimeInMs = 3;
	int32 PositionInMs = 4;
}
