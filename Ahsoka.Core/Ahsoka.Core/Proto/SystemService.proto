syntax = "proto3";

package AhsokaSystem;
option csharp_namespace = "Ahsoka.Services.System";

message SystemMessageTypes
{
	enum Ids
	{
		NO_MESSAGE = 0;

		ECHO = 1;
		GET_SERVICE_INFO = 4;
		GET_HARDWARE_INFORMATION = 8;

		LOAD_APPLICATION = 10;
		LOAD_APPLICATION_DATA = 12;
		LOAD_APPLICATION_CANCELLED = 14;

		GET_BRIGHTNESS = 15;
		SET_BRIGHTNESS = 17;

		SET_BOOT_LOGO = 30;

		TEST_NOTIF = 31;
		REQUEST_NOTIF = 32;

		REQUEST_SHUTDOWN = 100;
	}
}


// Echo (Test Method)
message EchoValue
{
	string data_value = 1;
}

// Service Info
message ServiceInfo
{
	repeated ServiceStats service_stats = 1; // System Services to Start.
}

// GetHardwareInformation Messages
message ServiceStats
{
	string service_name = 1;
	string service_address = 2;
	int32 receive_message_count = 3;
	int32 send_message_count = 4;
}

message GetHardwareInformationReply
{
	 int32 platform_family = 1;
     string platform_qualifier = 2;
	 string part_number = 3;	
	 string serial_number = 4;
	 bool is_installer = 5;
	 string application_name = 6;
	 string device_key = 7;
	 string device_id = 8;
	 double cpu_temp_in_c = 9;
	 map<string, string> version_info = 100;
}

/// LoadApplication Messages
message LoadApplication
{
	string file_name = 1;
	int32 file_size = 2;
	int32 timeout_in_ms = 3;	
	bool autoload = 4;
}

message LoadApplicationReply
{
	int32 upload_id = 1;
	string file_name = 2;
	int32 max_bytes_per_message = 3;
	MessageReplyStatus reply_status = 5;
	string reply_reason = 6;
}

message LoadApplicationData
{
	int32 upload_id = 1;
	bytes message_data = 2;
	int32 crc32 = 4;
}

message LoadApplicationDataReply
{
	int32 upload_id = 1;
	MessageReplyStatus reply_status = 4;
	string reply_reason = 5;
}

message LoadApplicationCancelled
{
	int32 upload_id = 1;
}

message LoadApplicationCompleteEventArgs
{
	bool autoload = 1;
	string file_name = 2;
}

// Brightness
message BrightnessInfo
{
	int32 percentage = 1;
	optional bool persist = 2;
}

enum MessageReplyStatus
{
    UNDETERMINED = 0;
    ERROR = 0;
    SUCCESS = 2;
    TIMEOUT = 3;
    CONTINUE = 4;
    CANCELLED = 5;
}

// Echo (Test Method)
message ShutdownInformation
{
	ShutdownTypes shutdown_type = 1;
	int32 shutdown_code = 2;
}

enum ShutdownTypes
{
	SHUTDOWN_SERVICES = 0;
	SHUTDOWN_APPLICATION = 1;
	REBOOT = 2;
}

message BootLogoInfo
{
	string path = 1;
	BootLogoRotation rotation = 2;
}

enum BootLogoRotation
{
	NO_ROTATION = 0;
	ROTATE_90 = 1;
	ROTATE_180 = 2;
	ROTATE_270 = 3;
}