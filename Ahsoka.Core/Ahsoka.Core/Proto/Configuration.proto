syntax = "proto3";

import "protobuf-net/protogen.proto";

package AhsokaSystem;
option csharp_namespace = "Ahsoka.Core";

enum PlatformFamily
{
    ANY = 0;
    WINDOWS_64 = 2;
    MACOS_ARM64 = 3 [(.protobuf_net.enumvalopt).name = "MacOSArm64"];
    OPEN_VIEW_LINUX = 4;
    OPEN_VIEW_LINUX_PRO = 5;
    UBUNTU_64 = 8;
    //RESERVED = 16;
    POWERVISION = 32 [(.protobuf_net.enumvalopt).name = "PowerVision"];
}

//----------------------------
// Service Definition 
//----------------------------
message RuntimeConfiguration
{
    repeated ServiceConfiguration services = 1; // System Services to Start.
}

message ServiceConfiguration
{
    string service_name = 2;
    string tcp_listen_address = 3;
    string tcp_connection_address = 4;
    int32 data_channel = 6;
    bool is_extension = 8;
    EndPointBehaviors behaviors = 10; 
}

message SecurityConfiguration
{
	bool require_challenge = 1;
	bytes application_id = 2;
	string token_public_key = 3;
	string token_private_key = 4;
}

enum EndPointBehaviors
{
    NO_BEHAVIOR = 0;
    AUTO_START = 1;
    SECURITY_ENABLED = 2;
}
