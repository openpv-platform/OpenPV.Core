syntax = "proto3";

package AhsokaBSPUpgrade;
option csharp_namespace = "Ahsoka.BSPUpgrade";

//----------------------------
// Service Definition 
//----------------------------
message UpgradeVolumeInfo
{
    string from_version = 1;
    string to_version = 2;
    string root_path = 3;
    string volume_label = 4;
    repeated UpgradeFileInfo deleted_files = 5; 
    repeated UpgradeFileInfo added_files = 6; 

}

message UpgradeFileInfo
{
    string file_path = 1;
    int64 file_size = 2;
    bool is_symlink = 3;
    string symlink_path = 4;
    int32 group_id = 5;
    int32 user_id = 6;
    UpgradeFilePermissions permissions = 7;
}


/// <summary>
/// Standard Unix-style file system permissions.
/// </summary>
enum UpgradeFilePermissions
{
    /// <summary>
    /// No permissions.
    /// </summary>
    None = 0;

    /// <summary>
    /// Any user execute permission.
    /// </summary>
    OthersExecute = 0x001;

    /// <summary>
    /// Any user write permission.
    /// </summary>
    OthersWrite = 0x002;

    /// <summary>
    /// Any user read permission.
    /// </summary>
    OthersRead = 0x004;

   
    /// <summary>
    /// Group execute permission.
    /// </summary>
    GroupExecute = 0x008;

    /// <summary>
    /// Group write permission.
    /// </summary>
    GroupWrite = 0x010;

    /// <summary>
    /// Group read permission.
    /// </summary>
    GroupRead = 0x020;


    /// <summary>
    /// Owner execute permission.
    /// </summary>
    OwnerExecute = 0x040;

    /// <summary>
    /// Owner write permission.
    /// </summary>
    OwnerWrite = 0x080;

    /// <summary>
    /// Owner read permission.
    /// </summary>
    OwnerRead = 0x100;

    /// <summary>
    /// Sticky bit (meaning ill-defined).
    /// </summary>
    Sticky = 0x200;

    /// <summary>
    /// Set GUID on execute.
    /// </summary>
    SetGroupId = 0x400;

    /// <summary>
    /// Set UID on execute.
    /// </summary>
    SetUserId = 0x800;
}