syntax = "proto3";

package AhsokaSecurity;
option csharp_namespace = "Ahsoka.Services.Security";

message SecurityMessageTypes
{
	enum Ids
	{
		NONE = 0;
		REQUEST_TOKEN = 2;
        CHALLENGE_RECEIVED = 4;
        COMPLETE_CHALLENGE = 5;
	    AUTHORIZATION_COMPLETE = 6;
	}
}


// Used for Cert based Auth (Client has Public Key)
message TokenRequestInfo
{
    string api_key = 1;
	repeated bytes client_ids = 2;
	string client_description = 3;
	string client_code = 4;
}

message TokenRequestResponse
{
   bytes request_id = 1;
}

// Used for Local Auth Operator Must Accept Challenge
message ChallengeRequestInfo
{
	bytes request_id = 1;
	string client_code = 2;
	string client_description = 3;
}

// Sent by UI when CHallenge is Completed
message ChallengeCompleteInfo
{
 	bytes request_id = 1;
    string client_code = 2;
	bool accept_request = 3;
	bytes client_id_signed = 4;
}

message Token
{
	bytes request_id = 1;
    bytes client_token = 2;	
	bool token_is_valid = 3;
}
