syntax = "proto3";

import "Configuration.proto";

package AhsokaDevice;
option csharp_namespace = "Ahsoka.Services.Device";

message DeviceMessageTypes
{
    enum Ids
	{
  		NO_MESSAGE = 0;

        GET_BRIGHTNESS = 1;
		SET_BRIGHTNESS = 2;

		GET_USB_INFO = 3;
		SET_USB_INFO = 4;
		
		SET_SERIAL_CONFIG = 5;

		UPDATE_TOUCH_TUNE = 6;

		GET_DEVICES = 10;

		ENABLE_DEVICE_NOTIFICATIONS = 11;

		ENABLE_DEVICE = 12;
        DISABLE_DEVICE = 13;

		ONBOARD_DEVICE_READY = 14;
	
		USB_DEVICE_ADDED = 15;
		USB_DEVICE_REMOVED = 16;

		DEVICE_ENABLED = 17;
		DEVICE_DISABLED = 18;
	}
}

//---------------------------------
// Adapter Info
//---------------------------------
message DeviceInfoRequest
{
	SupportedFeatures feature_search = 1;
}

//---------------------------------
// Adapter Info
//---------------------------------
message DeviceList
{
	repeated DeviceInfo devices = 1;
}

message UsbDeviceInfo
{
	string device_path = 1;
	DeviceInfo device_info = 2;
	uint32 vendor_id = 3;
	uint32 product_id = 4;
}

//---------------------------------
// Adapter Info
//---------------------------------
message DeviceInfo
{
	uint32 id = 1;
	string name = 2;
	DeviceState state = 4;
	DeviceTypes device_type = 5;
	string custom_startup = 6;
	bool auto_enable = 7;
}

enum DeviceLocation
{
	ANY_LOCATION = 0;
    NATIVE = 1;
    USB = 2;
}

enum DeviceState
{
	NO_STATE = 0;
	READY = 1;
    DISABLED = 2;
    ENABLED = 3;
}

// We aren't going to enumerate every field in the rs485_config because the only other field is padding.
message RS485ConfigNotification
{
    uint32 flags = 1;
    uint32 delay_rts_before_send = 2;
    uint32 delay_rts_after_send = 3;
}

// USB
message UsbInfo
{
	UsbPort port = 1;
	UsbMode mode = 2;
	string mount_point = 3;
}


enum UsbPort
{
	PRIMARY = 0;
	SECONDARY = 1;
}

enum UsbMode
{
	DEFAULT = 0;
	HOST = 1;
	DEVICE = 2;
}

message TouchTuneInfo
{
	string firmware_file_name = 1;
	string configuration_file_name = 2;
}

message TouchTuneInfoReply
{
	AhsokaSystem.MessageReplyStatus reply_status = 1;
	string reply_reason = 2;
	map<string, string> version_info = 100;
}



//---------------------------------
// Hardware Configuration
//---------------------------------
message HardwareConfiguration
{
	repeated HardwareItem hardware_items = 1;
	UsbMode usb_start_state_primary = 2;
	UsbMode usb_start_state_secondary = 3;
}

//---------------------------------
// Hardware Configuration Item
//---------------------------------
message HardwareItem
{
	string name = 1;
	DeviceTypes device_type = 2;
	DeviceState default_state = 4;
	string custom_startup = 6;
	bool auto_enable = 7;

}


enum SupportedFeatures
{
	FEATURES_UNKNOWN = 0;
	WIFI = 1;
	BLUETOOTH_CLASSIC = 2;
	BLUETOOTH_LE = 3;
	ETHERNET = 4;
	CELLULAR = 5;
	CAN = 6;
	IO = 7;
}


enum DeviceTypes
{
	DEVICE_TYPE_UNKNOWN = 0;
	ONBOARD_WIRELESS_COMBO_MODULE = 1;
	ONBOARD_WIFI_MODULE = 2;
	ONBOARD_BT_MODULE = 3;
	ONBOARD_ETHERNET = 4;
	USB_CELLULAR_NETWORK = 5;
	USB_ETHERNET = 6;
	IO_CONTROL_MODULE = 10;

}