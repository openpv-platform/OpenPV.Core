syntax = "proto3";

package AhsokaInstall;
option csharp_namespace = "Ahsoka.Services.Install";

message InstallMessageTypes
{
	enum Ids
	{
		NONE = 0;
		INSTALL_PACKAGE = 1;
		INSTALL_PROGRESS = 2;
		INSTALL_LOG = 4;
	}
}

message InstallPackageRequest
{
	string install_package_path = 1;
	string install_pass_key = 2;
}

message PackageProgressInfo
{
	string message = 2;
}

message PackageCompleteInfo
{
	string message = 2;
}

message InstallProgressInfo
{
	int32 percent_complete  = 1;
	string message = 2;
	bool update_percent_only = 3;
}

message InstallCompleteInfo
{
	InstallResult result  = 1;
	string message = 2;
}

message InstallLogInfo
{
	LogMessageType log_message_type  = 1;
	string log_message = 2;
}

enum InstallResult
{
    SUCCESS = 0;
    UNKNOWN_ERROR = 1;
    PREVIOUS_INSTALL_IN_PROGRESS = 2;
    EXCEPTION_THROWN_DURING_INSTALL = 3;
    INVALID_FILE = 301;                       	//-   301 - Invalid file: Can't Read
    PART_NUMBER_MATCH_FAILED = 303;             //-   303 - Part Number Match failed
    INVALID_COMPONENT_FILE = 304;				//-   304 - Corrupted Component File (CRC Mismatch)
    INVALID_COMPONENT_TYPE = 307;              	//-   307 - Unknown Component Type
    PASS_KEY_INCORRECT = 309;                  	//-   309 - PassKey incorrect
    UNKNOWN_HARDWARE_FAMILY = 402;			 	//-   402 - Unknown hardware family
    MISSING_PART_NUMBER = 403;                 	//-   403 - Missing part number
    MISSING_SERIAL_NUMBER = 404;           		//-   404 - Missing serial number*/
	MISSING_LICENSE_FOR_COMPONENT = 405;		//-   405 - A Software License could not be found for the Application Type / Module.
 }

enum LogMessageType
{
	ERROR = 0;
	WARNING = 1;
	INFORMATION = 2;
}
