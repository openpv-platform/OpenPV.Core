syntax = "proto3";

import "protobuf-net/protogen.proto";

package AhsokaSystem;
option csharp_namespace = "Ahsoka.System";

enum PlatformFamily
{
    ANY = 0;
    WINDOWS_64 = 2;
    MACOS_ARM64 = 3;
    OPEN_VIEW_LINUX = 4;
    OPEN_VIEW_LINUX_PRO = 5;
    UBUNTU_64 = 8;
    RASPBERRY_PI_OS_32 = 16 [(.protobuf_net.enumvalopt).name = "RaspberryPiOS32"];
    POWERVISION = 32 [(.protobuf_net.enumvalopt).name = "PowerVision"];
}

//----------------------------
// Service Definition 
//----------------------------
message RuntimeConfiguration
{
    repeated ServiceConfiguration services = 1; // System Services to Start.

    ServiceEnableDisable CustomServiceEnabled = 3;

    StartOptions ServiceStartup = 4;

    StartOptions ReleaseOption = 5;

    int32 StartupDelay = 6;

}

message ServiceConfiguration
{
    string service_name = 2;
    string tcp_listen_address = 3;
    string tcp_connection_address = 4;
    string ble_service_uuid_base = 5;
    int32 data_channel = 6;
    int32 notification_channel = 7;

    repeated DataServiceKeyItem data_key_values = 8; // System Services to Start.
}

message DataServiceKeyItem
{
    string key_name = 3;
    DataAccessLevel data_access_level = 4;
}


enum MessageReplyStatus
{
    UNDETERMINED = 0;
    ERROR = 1;
    SUCCESS = 2;
    TIMEOUT = 3;
    CONTINUE = 4;
    CANCELLED = 5;
}

// Enumerations
enum ByteOrder 
{
    LittleEndian = 0;
    BigEndian = 1;
}


enum DataAccessLevel 
{
    InternalOnly = 0;
    Diagnostic = 1;
    Public = 2;
}

enum StartOptions
{
    NoAutoStart = 0;
    BeforeApplicationStart = 1;
    AfterApplicationStart = 2;
}

enum ServiceEnableDisable
{
    Disabled = 0;
    Enabled = 1;
}
