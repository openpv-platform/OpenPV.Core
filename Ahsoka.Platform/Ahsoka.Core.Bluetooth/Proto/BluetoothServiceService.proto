syntax = "proto3";

package AhsokaBluetooth;
option csharp_namespace = "Ahsoka.Services.Bluetooth";

message BluetoothMessageTypes
{
    enum Ids
    {
        // Config
        GET_BLUETOOTH_CONFIGURATION = 1;
        SET_BLUETOOTH_CONFIGURATION = 2;

        // System Enable
        ENABLE_ADAPTER = 3;
        DISABLE_ADAPTER = 4;

        // Device State
        REQUEST_ADAPTER_STATE = 5;
        UPDATE_ADAPTER_STATE = 6;
        // ADAPTER_STATE_NOTIFICATION = 7;

        // Discovery
        START_DISCOVERY = 8;
        DISCOVERY_DEVICE_NOTIFICATION = 9;

        // Pairing
        REQUEST_TO_PAIR = 10;
        CompletePairRequest = 11;
        REQUEST_TO_UNPAIR = 12;
        PAIRED_DEVICE_NOTIFICATION = 13;

        // Paired Device Managment
        GET_PAIRED_DEVICES = 14;
        SET_PAIRED_DEVICES = 15;

        // Connect / Disconnect
        REQUEST_CONNECT = 16;
        REQUEST_DISCONNECT = 17;
        PROFILE_CONNECTION_STATE_CHANGED = 18;

        // Testing
        START_TEST_MODE = 20;
        STOP_TEST_MODE = 21;
        CONFIGURE_LOGGING = 22;
        DISABLE_LOGGING = 23;

        // Hfp
        GET_PHONE_STATUS = 30;
        GET_PHONE_STATUS_RESPONSE = 31;
        PHONE_CALL_NOTIFICATION = 32;
        PHONE_STATUS_CHANGED_NOTIFICATION = 33;
        SEND_PHONE_COMMAND = 34;
        SEND_PHONE_COMMAND_RESPONSE = 35;

        // Music Playback and Control
        START_LISTEN_FOR_SONG_INFO = 40;
        STOP_LISTEN_FOR_SONG_INFO = 41;
        SONG_INFO_CHANGED = 42;
        CONNECT_AUDIO = 43;
        DISCONNECT_AUDIO = 44;
        SEND_MUSIC_COMMAND = 45;
        SEND_MUSIC_COMMAND_RESPONSE = 46;

        // Message Access Profile
        SEND_TEXT_MESSAGE = 50;
        SEND_TEXT_MESSAGE_RESPONSE = 51;
        TEXT_MESSAGE_RECEIVED = 52;

            // PBAP ToDo?
            // PBAP Messages = 60;

        //Iap
        IAP_SESSION_BEGIN = 100;
        IAP_SESSION_ENDED = 101;
        IAP_LAUNCH_PHONE_APP = 103;
        IAP_DATA_RECEIVED = 104;
        IAP_SEND_DATA = 105;

        // SPP
        SPP_DATA_RECEIVED = 110;
        SPP_SEND_DATA = 111;
    }
}

//---------------------------------
// Configuration
//---------------------------------
message BluetoothConfiguration
{
	repeated BluetoothAdapterSetup adapter_configuration = 1;
}

message BluetoothAdapterSetup
{
    // Device Setup
    int32  adapter_index = 1;
    string device_discovery_name = 4;
    string device_mac_address = 9;

    // COD
    BluetoothMajorServiceClass service_class = 10;
    BluetoothMajorDeviceClass major_device_class = 11;
    int32  minor_device_class = 12;

    // Supported Pofiles
    BluetoothProfiles  supported_profiles = 13;

    // Behavior Setup Values
    int32  discovery_timeout = 100;
    int32  pairing_timeout = 101;
    int32  connection_timeout = 102;

    string device_interface_path = 103;
    SupportBluetoothStack stack = 104;


}

enum SupportBluetoothStack
{
    BLUEZ = 1;
}

message BluetoothAdapterState
{
    int32   adapter_index = 1;
    bool    is_present = 2;
    bool    is_enabled = 3;
    bool    is_discoverable = 4;
    bool    is_connectable = 5;
    bool    is_connected = 6;
    bool    is_polling = 7;
}

message BluetoothAdapterRequest
{
    int32  adapter_index = 1;
}

message BluetoothDeviceDiscoveryInfo
{
    int32  adapter_index = 1;
    string device_name = 2;
    string device_mac_address = 3;
    int32  device_rssi = 4;
}

message BluetoothDevicePairedInfo
{
    int32  adapter_index = 1;
    string device_name = 2;
    string device_mac_address = 3;
    int32  device_rssi = 4;
    bytes  link_key = 5;
    bytes  pass_key = 6;
    int32  connected_profiles = 7;
    bool   paired = 8;
}

message BluetoothPairedDevices
{
    int32  adapter_index = 1;
    repeated BluetoothDevicePairedInfo paired_device_list = 2;
}

message BluetoothConnectionRequest
{
    int32  adapter_index = 1;
    string device_mac_address = 2;
    BluetoothProfiles  requested_profiles = 3;
}

message ProfileConnectionState
{
    int32  adapter_index = 1;
    string device_mac_address = 2;
    BluetoothProfiles  profile = 3;
    bool   is_connected = 4;
}

message BluetoothTestConfiguration
{
    int32  adapter_index = 1;
    int32  power_level = 2;
    int32  frequency = 3;
    int32  mode = 4;
    int32  modulationtype = 5;
}

message BluetoothLoggingConfiguration
{
    int32  adapter_index = 1;
    LoggingVerbosity   adapter_logging_enabled = 2;
    LoggingVerbosity   connection_logging_enabled = 3;
    LoggingVerbosity   paring_logging_enabled = 4;
    LoggingVerbosity   audio_logging_enabled = 5;
    LoggingVerbosity   phone_logging_enabled = 6;
    LoggingVerbosity   text_logging_enabled = 7;
}

// -----------------------------
// Bluetooth Enumerations
// -----------------------------
enum BluetoothProfiles
{
    DEFAULT = 0;
    SPP = 1;
    HFP_AG = 2;
    HFP = 4;
    OPP = 8;
    A2DP_SINK = 16;
    A2DP_SOURCE = 32;
    AVRCP_SOURCE = 64;
    AVRCP_TARGET = 128;
    HID = 256;
    HSP_AG = 512;
    HSP = 1024;
    HDP_SINK = 2048;
    HDP_SOURCE = 4096;
    PBAP = 8192;
    BGIO = 16384;
    OTA = 32768;
    MAP = 65536;
    IAP = 131072;
}

enum LoggingVerbosity
{
    NONE = 0;
    ERRORS = 1;
    INFORMATION = 2;
    VERBOSE = 10;
}

// Major Service Class Bits of the CoD 23 22 21 20 19 18 17 16 15 14 13
// Each bit indicates a service supported by this device
enum BluetoothMajorServiceClass
{
    LIMITED_DISCOVERABLE_MODE = 1;
    POSITIONING = 8;
    NETWORKING = 16;
    RENDERING = 32;
    CAPTURING = 64;
    OBJECT_TRANSFER = 128;
    AUDIO = 256;
    TELEPHONY = 512;
    INFORMATION = 1024;
}

// Major Device Class Bits of the CoD  12  11  10  9  8
// Unsupported major classes of device are commented out until we support them
enum BluetoothMajorDeviceClass
{
    PHONE = 2;
    //LAN_NETWORK_ACCESS_POINT = 3;
    AUDIO_VIDEO = 4;
    //PERIPHERAL = 5;
    //IMAGING = 6;
    //WEARABLE = 7;
    //TOY = 8;
    //HEALTH = 9;
    UNCATEGORIZED = 31;
}

// Minor Device Class Bits of the CoD  7  6  5  4  3  2
enum PhoneMinorDeviceClass
{
    UNCATEGORIZED = 0;
    CELLULAR = 1;
    CORDLESS = 2;
    SMARTPHONE = 3;
    WIRED_MODEM_OR_VOICE_GATEWAY = 4;
    COMMON_ISDN_ACCESS = 5;
}

enum AudioVideoMinorDeviceClass
{
    UNCATEGORIZED = 0;
    WEARABLE_HEADSET_DEVICE = 1;
    HANDSFREE_DEVICE = 2;
    MICROPHONE = 4;
    LOUDSPEAKER = 5;
    HEADPHONES = 6;
    PORTABLE_AUDIO = 7;
    CAR_AUDIO = 8;
    SET_TOP_BOX = 9;
    HIFI_AUDIO_DEVICE = 10;
    VCR = 11;
    VIDEO_CAMERA = 12;
    CAMCORDER = 13;
    VIDEO_MONITOR = 14;
    VIDEO_DISPLAY_AND_LOUDSPEAKER = 15;
    VIDEO_CONFERENCING = 16;
    GAMING_TOY = 18;
}

