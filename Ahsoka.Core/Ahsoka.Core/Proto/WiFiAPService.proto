syntax = "proto3";

import "protobuf-net/protogen.proto";
import "WiFiClientService.proto";

package AhsokaNetwork;
option csharp_namespace = "Ahsoka.Services.Network";

message WiFiAPMessageTypes
{
    enum Ids
    {
        NONE = 0;
        GET_ADAPTERS = 1;
        START_ACCESS_POINT = 2;
        STOP_ACCESS_POINT = 3;
        GET_NETWORK_CONFIGURATION = 6;
        SET_NETWORK_CONFIGURATION = 8;
        GET_CLIENT_LIST = 9;
        CLIENT_ADDED = 10;
        CLIENT_REMOVED = 11;
   }
}

message AccessPointServiceConfiguration
{
    string adapter_id = 1;
    string description = 2;
    AccessPointConfiguration access_point_configuration = 5;
    DHCPServerConfiguration dhcp_server_configuration = 6;
    string override_mac_address = 7;
    bool save_as_default = 99;
}

message AccessPointConfiguration
{
    string ssid = 1;
    SecurityType security_type = 2;
    string encryption_pass_key = 5;
	bool broadcast_ssid = 6;
    int32 channel_number = 7;
	
    DHCPServerConfiguration dhcp_server_configuration = 10 [(.protobuf_net.fieldopt).name = "DHCPServerConfiguration"];
}

message DHCPServerConfiguration
{
    string dhcp_ip_base_address = 1;
    int32 dhcp_base_offset = 2;
    int32 dhcp_base_pool_size = 3;
    string dns = 6;
}

message AccessPointClientList
{
    string adapter_id = 1;
    int32 client_count = 2;
    repeated AccessPointClient clients = 3;
}
message AccessPointClient
{
    string mac_address = 1;
    int32 rssi = 2;
}