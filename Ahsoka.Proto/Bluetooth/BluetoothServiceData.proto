syntax = "proto3";

package Ahsoka.Services.Bluetooth;

    
message IapConfiguration
{
    string protocol = 1;
    string preferred_app_bundle = 2;
    string product_plan_uid = 3;
    string product_name = 5;
    string manufacturer_name = 6;
    string model_name = 7;
    string serial_number = 8;
}

message IapLaunchApp
{
    string launch_app = 1;
    IapLaunchAppMode mode = 2;
}

enum IapLaunchAppMode
{
    LAUNCH_WITH_ALERT = 1;
    LAUNCH_WITHOUT_ALERT = 2;
}

message IapNotification
{
    int32 iap_session_id = 1;
}

message IapData
{
    bytes data = 1;    
}

message SppData
{
    bytes data = 1;    
}
    
        
