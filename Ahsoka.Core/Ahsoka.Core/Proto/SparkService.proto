syntax = "proto3";

package AhsokaSpark;
option csharp_namespace = "Ahsoka.Services.Spark";

message SparkMessageTypes
{
	enum Ids
	{
		NONE = 0;
		SET_SPARK_SUBSCRIPTION = 1;
		GET_SPARK_SUBSCRIPTION = 2;
		GET_AVAILABLE_RELEASES = 4;
		GET_RELEASE = 6;
		GET_RELEASE_NOTIFICATION = 7; //  Occurs During GetRelease
		UPDATE_LICENSE_INFO = 8;
		SUBSCRIBE_TO_APP_CHANGE = 9;
		UNSUBSCRIBE_TO_APP_CHANGE = 10;
		APP_CHANGE_NOTIFICATION = 11;
	}
}

/// LoadApplication Messages
message SparkSubscription
{
	string release_name = 1;
	string channel_name = 2;
	string subscription_url = 3;
	string device_id = 4;
	bool is_factory_subscrption = 5;
}

message SparkSubscriptionInfo
{
	string device_id = 1;
	string device_key = 2;
	string part_number = 3;
	string serial_number = 4;
	string release_name = 10;
	string channel_name = 11;
	string subscription_url = 12;

}

message SparkReleaseInfo
{
	MessageReplyStatus result = 1;
	string result_text = 2;
	repeated SparkRelease releases = 3;
}


enum MessageReplyStatus
{
    UNDETERMINED = 0;
    ERROR = 1;
    SUCCESS = 2;
    TIMEOUT = 3;
    CONTINUE = 4;
    CANCELLED = 5;
}

message SparkRelease
{
    string release_id = 1;
    SparkTrack track = 2;
    string channel_name = 3;
    string release_name = 4;
    string container_name = 5;
    string container_version = 6;
}

message SparkReleaseDownloadRequest
{
  string release_id = 1;
  string path_to_file = 2;
  int32 timeout_in_seconds = 3;
}

message SparkReleaseDownloadNotification
{
  string release_id = 1;
  int32 percent_completed = 2;
  MessageReplyStatus status = 3;
}

message SparkReleaseDownloadCompleted
{
  string release_id = 1;
  string result_text = 2;
  MessageReplyStatus status = 3;
}

message AppChangeInfo
{
	string ChannelName = 1;
	string ReleaseName = 2;
	AppChangesEnum AppEvent = 3;
	string Message = 4;
}

enum SparkTrack
{
    DEVELOPMENT = 0;
    CANARY = 1;
    BETA = 2;
    RELEASE = 3;
    NO_TRACK = 99;
}

enum AppChangesEnum
{
	NO_CHANGES = 0;
	UPDATE_RELEASE = 1;
}